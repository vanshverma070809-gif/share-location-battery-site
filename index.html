<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#photo{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover}
#consent{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
width:min(90vw,420px);padding:16px;border-radius:16px;background:rgba(0,0,0,.86);
color:#fff;font:15px/1.45 Arial,sans-serif;text-align:center;box-shadow:0 4px 30px #000}
#consent button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;
font-weight:700;font-size:15px}
#status{margin-top:10px;font-size:13px;color:#ccc}
.hidden{display:none}
</style>
</head>
<body>
<img id="photo" src="moon.jpg" alt="Photo">

<div id="consent">
  <div><b>Share location & battery?</b></div>
  <div>This lets the page owner receive your location. Battery information may be unavailable in some browsers.</div>
  <button id="share">Share & continue</button>
  <div id="status"></div>
</div>

<script>
const box=document.getElementById("consent");
const status=document.getElementById("status");
document.getElementById("share").onclick=async()=>{
  status.textContent="Requesting location permission…";
  if(!navigator.geolocation){
    status.textContent="Location is not supported by this browser.";
    return;
  }
  navigator.geolocation.getCurrentPosition(async p=>{
    let battery=null;
    try{
      if(navigator.getBattery){
        const b=await navigator.getBattery();
        battery=Math.round(b.level*100);
      }
    }catch(e){}
    const data={
      latitude:p.coords.latitude,
      longitude:p.coords.longitude,
      accuracy:p.coords.accuracy,
      battery:battery,
      sharedAt:new Date().toISOString()
    };
    // Replace this URL with your own consent-based backend endpoint.
    console.log("Consent-based location data:",data);
    box.classList.add("hidden");
  },()=>{
    status.textContent="Location permission was denied or unavailable.";
  },{enableHighAccuracy:true,timeout:10000,maximumAge:0});
};
</script>
</body>
</html>
